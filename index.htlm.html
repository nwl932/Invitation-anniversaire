<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux anniversaire 🎉</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #080228, #11023f);
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      animation: fadeIn 2s ease-in-out;
      z-index: 1;
    }

    button {
      background-color: white;
      color: #333;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 1.2em;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.3s ease, background 0.3s;
      z-index: 1;
    }

    button:hover {
      background: #ffdde1;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Canvas pour les confettis -->
  <canvas id="confetti"></canvas>

  <!-- Texte et bouton -->
  <h1>🎉 Joyeux anniversaire Papa 🎉</h1>
  <button onclick="window.location.href='invitation.html'">Clique ici pour découvrir ta surprise 🎁</button>

  <script>
    // Script des confettis 🎊
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettis = [];
    function random(min, max) { return Math.random() * (max - min) + min; }

    for (let i = 0; i < 150; i++) {
      confettis.push({
        x: random(0, canvas.width),
        y: random(0, canvas.height),
        r: random(3, 6),
        dx: random(-1, 1),
        dy: random(1, 3),
        color: `hsl(${random(0, 360)}, 100%, 70%)` // couleurs aléatoires
      });
    }

    function drawConfettis() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettis.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, 2 * Math.PI);
        ctx.fillStyle = c.color;
        ctx.fill();
        c.x += c.dx;
        c.y += c.dy;
        if (c.y > canvas.height) c.y = 0;
      });
      requestAnimationFrame(drawConfettis);
    }
    drawConfettis();

    // Redimension automatique
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
